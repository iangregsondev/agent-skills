packages:
  - skills/**

catalogMode: prefer

catalog:
  "@anthropic-ai/claude-code": ^2.1.220
  "@changesets/changelog-github": ^0.7.0
  "@changesets/cli": ^2.31.1
  "@types/node": ^26
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.7
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
