name: Release

on:
  push:
    branches:
      - main
  # A `push` event that never dispatches a run is not retried and cannot be replayed,
  # so a release dropped that way stays dropped. This is the only lever to ask for it.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The dispatch offers every branch holding this file, and changesets versions
    # whichever ref is checked out — from anywhere but main it would version the wrong
    # tree and consume the changeset files doing it.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release pull request is authored by this App rather than
      # github-actions[bot], so its CI runs without a maintainer approving each one.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install Dependencies
        run: vp install

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: vp run release:version
          publish: vpx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
